<!doctype html>
<html lang="ja"><meta charset="utf-8"><title>アクセス記録のブラウザ検証</title>
<style>body{margin:0}iframe{width:100%;height:100vh;border:0;display:block}</style>
<iframe id="app-under-test" title="アクセス記録検証用アプリ"></iframe>
<script type="module">
// Test-only interception, installed before the unchanged production app module.
// ?fail=1 simulates rejected fetch; otherwise the request goes to the real GAS.
const fail=new URLSearchParams(location.search).has('fail');
const html=await fetch('/index.html').then(r=>r.text());
const bootstrap=`<base href="/"><script>
const nativeFetch=window.fetch.bind(window);
const attempts=[];
window.fetch=(url,options)=>{
 attempts.push({url:String(url),options});
 document.documentElement.dataset.accessAttempts=JSON.stringify(attempts);
 return ${fail?'Promise.reject(new Error("simulated network failure"))':'nativeFetch(url,options)'};
};
<\/script>`;
document.querySelector('iframe').srcdoc=html.replace('<head>','<head>'+bootstrap);
</script></html>
